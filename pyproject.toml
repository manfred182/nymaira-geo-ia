[project]
name = "geoia"
version = "0.1.0"
description = "IA orientada a procesos catastrales y geoespaciales"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "rasterio>=1.4.0",
    "geopandas>=1.0.0",
    "shapely>=2.0.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "accelerate>=1.0.0",
    "opencv-python>=4.9.0",
    "python-multipart>=0.0.9",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "PyMuPDF>=1.24.0",
    "httpx>=0.27.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
ai = [
    "paddleocr>=2.8.0",
    "openai-whisper>=20240930",
    "gliner>=0.2.0",
]

[project.scripts]
geoia = "geoia.cli:main"

[tool.setuptools.packages.find]
where = ["."]
